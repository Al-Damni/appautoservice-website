kind = "web"
previewPath = "/"
title = "ALDAMNI Group"
description = "A bilingual corporate hub for ALDAMNI Group and Auto Service App, presenting its energy, automotive, food, and smart agriculture divisions with brand previews and company contacts."
version = "1.0.0"
id = "artifacts/aldamni-corporate"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19334

[services.development]
run = "pnpm --filter @workspace/aldamni-corporate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aldamni-corporate", "run", "build" ]
serve = "static"
publicDir = "artifacts/aldamni-corporate/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19334"
BASE_PATH = "/"
