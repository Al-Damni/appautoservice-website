kind = "web"
previewPath = "/"
title = "Auto Service App for General Trading"
description = "Auto Service App for General Trading is a bilingual corporate website for its petroleum supply, automotive parts, lubricants, Syrian foods, hydroponics, regional offices, and browser-local image uploads."
version = "1.0.0"
id = "artifacts/aldamni-corporate"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19334

[services.development]
run = "pnpm --filter @workspace/aldamni-corporate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aldamni-corporate", "run", "build" ]
serve = "static"
publicDir = "artifacts/aldamni-corporate/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19334"
BASE_PATH = "/"
